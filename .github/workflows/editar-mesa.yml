name: editar-mesa
# OPERAÇÃO mesa · renderiza os pedidos (pedidos/mesa/*.json) e salva no Drive. Ver edicao/LEIA.md.
on:
  push:
    paths: ["pedidos/mesa/*.json"]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: editar-mesa
  cancel-in-progress: false
jobs:
  editar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Há pedidos?
        id: fila
        run: echo "n=$(ls pedidos/mesa/*.json 2>/dev/null | wc -l)" >> $GITHUB_OUTPUT
      - name: Ferramentas
        if: steps.fila.outputs.n != '0'
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core
          pip install -q faster-whisper "yt-dlp[default]"
          curl -s https://rclone.org/install.sh | sudo bash > /dev/null
          mkdir -p ~/.config/rclone && echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          npm ci --silent
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      - name: Editar
        if: steps.fila.outputs.n != '0'
        env:
          TG_CONF: ${{ secrets.TG_CONF }}
          ESCRITORIO_API: ${{ secrets.ESCRITORIO_API }}
          ESCRITORIO_TOKEN: ${{ secrets.ESCRITORIO_TOKEN }}
          FONTES: fontes
        run: |
          git config user.name "editor" && git config user.email "editor@users.noreply.github.com"
          mkdir -p pedidos/mesa/feitos
          for P in pedidos/mesa/*.json; do
            NOME=$(basename "$P")
            read -r PROJ SAIDA LIVE TITULO < <(python3 -c "import json,sys;p=json.load(open('$P'));d={'gta-vi':'GTA VI','darks-clips':'Darks Clips'}[p['projeto']];f=p['fonte'].get('drive','').split('/')[-1];print(d.replace(' ','_'),p['saida'],f or '-',p.get('titulo','').replace(chr(10),' '))")
            PROJ=${PROJ//_/ }
            if python3 edicao/editar.py "$P" "trab"; then
              rclone copy "trab/$SAIDA" "drive:Direto de Vice/$PROJ/02-Prontos" && echo "no Drive: $PROJ/02-Prontos/$SAIDA"
              CONF=$(python3 -c "import json;c=json.load(open('trab/conferencia.json'));print('✅ conferência técnica ok' if not c['problemas'] else '⚠️ conferir: '+'; '.join(c['problemas']))")
              mkdir -p conferencias && cp trab/conferencia.json "conferencias/${NOME%.json}.json"
              if [ -n "$TG_CONF" ] && [ -f tg.json ]; then node tg.js enviar "trab/$SAIDA" cortes "🧪 TESTE (mesa) · revisar · $PROJ
          $TITULO
          $CONF
          Drive: Direto de Vice/$PROJ/02-Prontos/$SAIDA" || true; fi
              # revisão de modelagem na Mesa do Escritório (link do Drive)
              if [ -n "$ESCRITORIO_API" ]; then
                ID=$(rclone lsjson "drive:Direto de Vice/$PROJ/02-Prontos/$SAIDA" | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['ID'])" 2>/dev/null)
                [ -n "$ID" ] && node mesa.mjs pedir --projeto "${NOME%.json}" --setor edicao --etapa modelagem --titulo "🧪 Modelagem mesa: o que mudar neste vídeo?" --resumo "$TITULO | $CONF" --link "https://drive.google.com/file/d/$ID/view" || echo "Mesa não respondeu"
              fi
              git mv "$P" "pedidos/mesa/feitos/$NOME"
              # a live só vira "usada" (e sai do Drive na faxina) quando não sobra pedido dela na fila
              if [ "$LIVE" != "-" ] && ! grep -lF "$LIVE" pedidos/mesa/*.json >/dev/null 2>&1; then grep -qxF "$LIVE" usadas.txt 2>/dev/null || echo "$LIVE" >> usadas.txt; fi
            else
              mkdir -p pedidos/mesa/erros && git mv "$P" "pedidos/mesa/erros/$NOME"
            fi
            rm -rf trab
            git add -A pedidos usadas.txt conferencias && git commit -qm "edição: $NOME" || true
            for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 7; done
          done
