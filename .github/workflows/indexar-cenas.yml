name: indexar-cenas
# Mantém cenas/indice.json (o banco de cenas da MESA DE MILIONÁRIO no Drive vichatori).
# Nunca reordena: cena nova entra no FIM da lista (o número dela é a posição, usado nas miniaturas e no catálogo).
on:
  schedule:
    - cron: "10 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cenas
  cancel-in-progress: false
jobs:
  indexar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Listar
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          curl -s https://rclone.org/install.sh | sudo bash > /dev/null
          mkdir -p ~/.config/rclone && echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          mkdir -p cenas
          python3 edicao/cenas.py indexar
          git config user.name "cenas" && git config user.email "cenas@users.noreply.github.com"
          git add cenas && git commit -qm "índice do banco de cenas" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
