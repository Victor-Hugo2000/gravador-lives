name: organizar-cenas
# Depois que o Claude cataloga, move e renomeia cada cena no Drive para
# 'Darks Clips/Banco de Cenas/<pasta>/<nome-descritivo>-<NNNN>.mp4' (só move dentro do Drive; nada é apagado).
on:
  push:
    paths: ["cenas/catalogo.json"]
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cenas
  cancel-in-progress: false
jobs:
  organizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Organizar
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          curl -s https://rclone.org/install.sh | sudo bash > /dev/null
          mkdir -p ~/.config/rclone && echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          python3 edicao/cenas.py organizar
          git config user.name "cenas" && git config user.email "cenas@users.noreply.github.com"
          git add cenas && git commit -qm "banco de cenas organizado em pastas" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
