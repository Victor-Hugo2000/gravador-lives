name: faxina
# Rodízio do Drive (de hora em hora). Só apaga o que já está guardado no Telegram.
# 1. Live usada: assim que a etapa iniciar tira os cortes de uma live, o nome dela entra em usadas.txt
#    e ela sai do Drive na próxima faxina (vai para a lixeira do Drive, que guarda por 30 dias).
# 2. Segurança contra Drive cheio: live com mais de 7 dias sem uso também sai, a não ser que esteja em manter.txt.
# Vídeos postados saem pelo robô "arquivar", chamado pela postagem automática.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  faxina:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s https://rclone.org/install.sh | sudo bash > /dev/null
          mkdir -p ~/.config/rclone && echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      - name: Tirar do Drive as lives usadas e as esquecidas
        run: |
          touch manter.txt usadas.txt
          D="drive:Direto de Vice/01-Brutos/Lives"
          noTelegram() { grep -F "| $1 |" lives.md | grep -q "| sim |"; }
          VELHAS=$(rclone lsf "$D" --min-age 7d --files-only)
          rclone lsf "$D" --files-only | while read -r F; do
            if grep -qxF "$F" usadas.txt; then MOTIVO="usada nos cortes"
            elif echo "$VELHAS" | grep -qxF "$F" && ! grep -qxF "$F" manter.txt; then MOTIVO="mais de 7 dias sem uso"
            else continue; fi
            if noTelegram "$F"; then rclone delete "$D/$F" && echo "saiu do Drive ($MOTIVO): $F"
            else echo "fica, ainda não está no Telegram ($MOTIVO): $F"; fi
          done
          rclone about drive: | head -3
