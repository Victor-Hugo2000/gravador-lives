name: garimpo-pinterest
# Alimenta o banco de cenas da MESA DE MILIONÁRIO com vídeos de quadros públicos do Pinterest (seg, qua e sex, 10h de Brasília).
# Meta: pelo menos 20 cenas novas por rodada. Baixa ~40 candidatas (4 a 40 s, altura >= 720); o catálogo do Claude
# descarta as que não servem (marca d'água, texto grande, qualidade ruim) e o organizar-cenas põe cada uma na pasta certa.
on:
  schedule:
    - cron: "0 13 * * 1,3,5"
  workflow_dispatch:
    inputs:
      quantas: { required: false, default: "40" }
permissions:
  contents: write
concurrency:
  group: cenas
  cancel-in-progress: false
jobs:
  garimpar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QUANTAS: ${{ inputs.quantas || '40' }}
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          pip install -q -U "yt-dlp[default]"
          curl -s https://rclone.org/install.sh | sudo bash > /dev/null
          mkdir -p ~/.config/rclone && echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Garimpar
        run: |
          mkdir -p trab/novas
          python3 - <<'PY'
          import os, subprocess, json, random
          quadros = [l.strip() for l in open("pinterest/quadros.txt") if l.strip().startswith("http")]
          vistos = set(open("pinterest/vistos.txt").read().split())
          meta = int(os.environ.get("QUANTAS", "40")); baixadas = 0; novos_vistos = []
          random.shuffle(quadros)
          for q in quadros:
              if baixadas >= meta: break
              r = subprocess.run(["yt-dlp", "--flat-playlist", "-J", q], capture_output=True, text=True)
              try: itens = json.loads(r.stdout).get("entries") or []
              except Exception: print("quadro falhou:", q); continue
              for e in itens:
                  if baixadas >= meta: break
                  pid = str(e.get("id")); d = e.get("duration") or 0
                  if pid in vistos or not (4 <= d <= 40): continue
                  vistos.add(pid); novos_vistos.append(pid)
                  url = e.get("url") or e.get("webpage_url") or f"https://www.pinterest.com/pin/{pid}/"
                  out = f"trab/novas/pin-{pid[-12:]}.mp4"
                  if subprocess.run(["yt-dlp", "-q", "--no-warnings", "-f", "bv*[height>=720]+ba/b[height>=720]/bv*+ba/b",
                                     "--merge-output-format", "mp4", "-o", out, url]).returncode: continue
                  h = subprocess.run(["ffprobe","-v","error","-select_streams","v:0","-show_entries","stream=height","-of","csv=p=0",out],capture_output=True,text=True).stdout.strip()
                  if not h.isdigit() or int(h) < 720: os.remove(out); continue
                  baixadas += 1
          open("pinterest/vistos.txt","a").write("".join(x + "\n" for x in novos_vistos))
          print("cenas novas baixadas:", baixadas)
          open("trab/total.txt","w").write(str(baixadas))
          PY
          rclone copy trab/novas "drive:Darks Clips/Banco de Cenas/_Novas do Pinterest"
          python3 edicao/cenas.py indexar
          echo "| $(date +%F) | $(cat trab/total.txt) cenas novas |" >> pinterest/rodadas.md
          git config user.name "pinterest" && git config user.email "pinterest@users.noreply.github.com"
          git add pinterest cenas && git commit -qm "garimpo Pinterest: $(cat trab/total.txt) cenas novas" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
